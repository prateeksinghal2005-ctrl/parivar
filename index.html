<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hamara Parivar</title>
  <style>
    body { font-family: Georgia, serif; background: #eef2ec; color: #1c2b22;
           max-width: 640px; margin: 0 auto; padding: 20px; }
    .path { color: #5d6b62; font-size: 14px; }
    button { padding: 8px 14px; font-size: 16px; cursor: pointer; margin: 6px 0 14px; }

    /* upar wale bade cards */
    .people { display: flex; gap: 24px; flex-wrap: wrap; margin: 10px 0; }
    .pcard { text-align: center; }
    .pcard b { display: block; font-size: 22px; margin-top: 8px; }
    .pcard small { color: #5d6b62; }

    /* photos */
    .big   { width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
             border: 3px solid #1f5a3c; display: block; margin: 0 auto; }
    .small { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .tiny  { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .blank { background: #cdd8cf; }

    /* bachchon ki list */
    ul { list-style: none; padding: 0; }
    li { display: flex; gap: 12px; align-items: center; background: #fff;
         border: 1px solid #cdd8cf; border-left: 6px solid #1f5a3c;
         border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
    li:hover { background: #f4faf5; }
    li b { display: block; }
    li small { color: #5d6b62; display: block; }
    .sp { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .zoom { cursor: zoom-in; }
#overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
           z-index: 10; flex-direction: column; align-items: center;
           justify-content: center; padding: 20px; cursor: zoom-out; }
#overlay img { max-width: 100%; max-height: 80vh; border-radius: 8px; }
#overlay p { color: #fff; font-size: 20px; margin: 12px 0 0; text-align: center; }
  </style>
</head>
<body>
  <p class="path" id="path"></p>
  <div class="people" id="people"></div>
  <button id="back">Wapas jao</button>
  <h3 id="title"></h3>
  <ul id="list"></ul>
<div id="overlay"><img id="bigphoto" alt=""><p id="cap"></p></div>
  <script>
    // ============================================================
    //  APNA PARIVAR YAHAN LIKHO
    //  Har person: name, dob, photo, spouse (pati/patni), children
    //  - Jiski shaadi nahi hui: spouse: null
    //  - Jiske bacche nahi: children: []
    //  - Photo/dob nahi pata: "" (khali) rakh do
    // ============================================================

      children: [

        // ---------- Son 1 ----------
        { name: "Dinesh", dob: "xx-xx-xxxx", photo: "photos/dinesh.jpg",
          spouse: { name: "Aasha", dob: "xx-xx-xxxx", photo: "photos/Aasha.jpg" },
          children: [
            { name: "Mona", dob: "xx-xx-xxxx", photo: "photos/Mona.jpg",
              spouse: { name: "Yogi", dob: "xx-xx-xxxx", photo: "photos/Yogi.jpg" },
              children: [
                { name: "Aadhya", dob: "xx-xx-xxxx", photo: "photos/Aadhya.jpg", spouse: null, children: [] },

              children: [

              ]
            }
          ]
        },

        // ---------- Son 2 ----------
        { name: "Umesh", dob: "xx-xx-xxxx", photo: "photos/umesh.jpg",
          spouse: { name: "Nirmala", dob: "xx-xx-xxxx", photo: "photos/nirmala.jpg" },
          children: [
            { name: "Rohit", dob: "xx-xx-xxxx", photo: "photos/rohit.jpg",
              spouse: { name: "Pooja", dob: "xx-xx-xxxx", photo: "photos/pooja.jpg" },
              children: []
            },
            { name: "Shubhangi", dob: "xx-xx-xxxx", photo: "photos/shubhangi.jpg",
              spouse: { name: "Anil", dob: "xx-xx-xxxx", photo: "photos/anil.jpg" },
              children: []

          ]

        { name: "Mahendra", dob: "xx-xx-xxxx", photo: "photos/mahendra.jpg",
          spouse: { name: "Kanta", dob: "xx-xx-xxxx", photo: "photos/kanta.jpg" },
          children: [
            { name: "Garima", dob: "04.04.1993", photo: "photos/garima.jpg",
              spouse: { name: "Dheeraj", dob: "01.08.1993", photo: "photos/dheeraj.jpg" },

            },

        },

        { name: "Kailash", dob: "xx-xx-xxxx", photo: "photos/kailash.jpg",

          children: [
            { name: "Sparsh", dob: "xx-xx-xxxx", photo: "photos/sparsh.jpg", spouse: null, children: [] },
            { name: "Vanshika", dob: "xx-xx-xxxx", photo: "photos/vanshika.jpg", spouse: null, children: [] }
          ]
        },
        // ---------- Son 5 ----------
        { name: "Keshav", dob: "xx-xx-xxxx", photo: "photos/Keshav.jpg",
          spouse: { name: "Babita", dob: "xx-xx-xxxx", photo: "photos/Babita.jpg" },
          children: [
            { name: "Abhishek", dob: "xx-xx-xxxx", photo: "photos/abhishek.jpg", spouse: null, children: [] },
            { name: "Kinjal", dob: "xx-xx-xxxx", photo: "photos/kinjal.jpg", spouse: null, children: [] },
              ]

    // ============================================================
    //  Yahan se neeche kuch badalne ki zaroorat nahi
    // ============================================================
    var path = [family];

// photo ka path GitHub ke hisaab se theek karta hai


function avatar(p, cls) {
  if (p.photo) {
    var i = document.createElement("img");
    i.src = fixPath(p.photo); i.alt = p.name; i.className = cls + " zoom";
    i.onclick = function (e) { e.stopPropagation(); openPhoto(p); };
    return i;
  }
  var d = document.createElement("div");
  d.className = cls + " blank";
  return d;
}

function openPhoto(p) {
  document.getElementById("bigphoto").src = fixPath(p.photo);
  document.getElementById("cap").textContent = p.name + (p.dob ? "  |  " + p.dob : "");
  document.getElementById("overlay").style.display = "flex";
}

document.getElementById("overlay").onclick = function () {
  this.style.display = "none";
};
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") document.getElementById("overlay").style.display = "none";
});
    function bigCard(p) {
      var d = document.createElement("div");
      d.className = "pcard";
      d.appendChild(avatar(p, "big"));
      var b = document.createElement("b"); b.textContent = p.name;
      d.appendChild(b);
      if (p.dob) {
        var s = document.createElement("small"); s.textContent = p.dob;
        d.appendChild(s);
      }
      return d;
    }

    function show() {
      var person = path[path.length - 1];

      document.getElementById("path").textContent =
        path.map(function (p) { return p.name; }).join("  >  ");

      var people = document.getElementById("people");
      people.innerHTML = "";
      people.appendChild(bigCard(person));
      if (person.spouse) people.appendChild(bigCard(person.spouse));

      document.getElementById("back").style.display =
        path.length > 1 ? "inline-block" : "none";

      var list = document.getElementById("list");
      list.innerHTML = "";

      if (person.children.length === 0) {
        document.getElementById("title").textContent = "Koi bachcha nahi hai";
        return;
      }
      document.getElementById("title").textContent = person.name + " ke bachche:";

      person.children.forEach(function (child) {
        var li = document.createElement("li");
        li.appendChild(avatar(child, "small"));

        var box = document.createElement("div");
        var b = document.createElement("b"); b.textContent = child.name;
        box.appendChild(b);

        if (child.dob) {
          var s = document.createElement("small"); s.textContent = child.dob;
          box.appendChild(s);
        }

        if (child.spouse) {
          var sp = document.createElement("div");
          sp.className = "sp";
          sp.appendChild(avatar(child.spouse, "tiny"));
          var t = document.createElement("span");
          t.textContent = child.spouse.name;
          sp.appendChild(t);
          box.appendChild(sp);
        }

        li.appendChild(box);
        li.onclick = function () { path.push(child); show(); };
        list.appendChild(li);
      });
    }

    document.getElementById("back").onclick = function () {
      if (path.length > 1) { path.pop(); show(); }
    };

    show();
  </script>
</body>
</html>
