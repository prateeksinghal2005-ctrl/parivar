<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap">
  <style>
    :root {
      --bg: #0f1220;
      --ink: #f3ecdf;
      --muted: #a8a2b8;
      --gold: #d9b26f;
      --line: rgba(217, 178, 111, .55);
    }
    body {
      margin: 0; padding: 40px 20px 60px; min-height: 100vh; color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(900px 500px at 50% -10%, #2c2254 0%, transparent 60%),
        radial-gradient(700px 500px at 100% 100%, rgba(80, 30, 70, .45) 0%, transparent 60%),
        var(--bg);
    }
    h1 {
      text-align: center; margin: 0; font-weight: 400;
      font-family: "Tiro Devanagari Hindi", Georgia, serif;
      font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .02em;
    }
    h1::after {
      content: ""; display: block; width: 72px; height: 2px;
      margin: 14px auto 0; background: var(--gold);
    }
    .hint {
      text-align: center; color: var(--muted); margin: 14px 0 6px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic; font-size: 19px;
    }
    .wrap { display: flex; overflow-x: auto; padding: 30px 10px 50px; }

    /* ---------- tree ki lines ---------- */
    .tree { flex: none; margin: 0 auto; }
    .tree ul { display: flex; justify-content: center; padding: 24px 0 0; margin: 0; position: relative; }
    .tree li { list-style: none; text-align: center; position: relative; padding: 24px 10px 0; }
    .tree li::before, .tree li::after {
      content: ""; position: absolute; top: 0; right: 50%;
      border-top: 1.5px solid var(--line); width: 50%; height: 24px; }
    .tree li::after { right: auto; left: 50%; border-left: 1.5px solid var(--line); }
    .tree li:only-child::before, .tree li:only-child::after { display: none; }
    .tree li:only-child { padding-top: 0; }
    .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
    .tree li:last-child::before { border-right: 1.5px solid var(--line); border-radius: 0 10px 0 0; }
    .tree li:first-child::after { border-radius: 10px 0 0 0; }
    .tree ul ul::before {
      content: ""; position: absolute; top: 0; left: 50%;
      border-left: 1.5px solid var(--line); height: 24px; }
    .tree > ul { padding-top: 0; }
    .tree > ul > li { padding-top: 0; }
    .tree li.closed > ul { display: none; }

    /* ---------- person ka dabba ---------- */
    .node {
      position: relative; overflow: hidden; display: inline-flex; gap: 14px;
      align-items: flex-start; padding: 18px 16px 14px; border-radius: 18px; cursor: pointer;
      background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.12);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px -12px rgba(0,0,0,.7);
      transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s;
    }
    .node::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
      background: var(--c, var(--gold));
    }
    .node:hover {
      transform: translateY(-8px) scale(1.05);
      border-color: var(--c, var(--gold));
      box-shadow: 0 22px 40px -10px color-mix(in srgb, var(--c, #d9b26f) 70%, transparent),
                  0 0 0 1px var(--c, var(--gold));
    }
    .node:active { transform: scale(.94); }
    .node.pop { animation: pop .4s ease; }
    .node .person + .person { border-left: 1px solid var(--line); padding-left: 14px; }

    .person { width: 100px; }
    .person b {
      display: block; margin-top: 8px; font-weight: 700; font-size: 19px; line-height: 1.15;
      font-family: "Cormorant Garamond", Georgia, serif;
    }
    .person small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; letter-spacing: .04em; }

    .photo {
      width: 68px; height: 68px; border-radius: 50%; object-fit: cover;
      display: block; margin: 0 auto; padding: 2px; background: #2a2540;
      border: 2px solid var(--c, var(--gold));
      box-shadow: 0 0 0 4px rgba(255,255,255,.06);
      transition: transform .3s ease;
    }
    .node:hover .photo { transform: scale(1.1) rotate(-4deg); }
    .zoom { cursor: zoom-in; }

    .count {
      display: inline-block; margin-top: 12px; padding: 2px 12px; border-radius: 99px;
      font-size: 11px; letter-spacing: .05em; color: var(--gold);
      border: 1px solid var(--line); background: rgba(217,178,111,.08);
    }
    .tree li.closed > .count { background: var(--gold); color: #1a1530; }

    .tree li > ul { animation: grow .4s ease; transform-origin: top center; }

    /* ---------- click par chamakti bindiyan ---------- */
    .spark {
      position: fixed; pointer-events: none; z-index: 20;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--sc); box-shadow: 0 0 10px var(--sc);
      animation: fly .7s ease-out forwards;
    }

    /* ---------- photo bada karne wala ---------- */
    #overlay {
      display: none; position: fixed; inset: 0; z-index: 10; padding: 20px; cursor: zoom-out;
      background: rgba(8, 8, 18, .9); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      flex-direction: column; align-items: center; justify-content: center;
    }
    #overlay img {
      max-width: 100%; max-height: 78vh; border-radius: 14px;
      border: 2px solid var(--gold); box-shadow: 0 30px 60px -10px rgba(0,0,0,.8);
    }
    #overlay p {
      margin: 16px 0 0; text-align: center; color: var(--gold);
      font-family: "Cormorant Garamond", Georgia, serif; font-size: 26px; font-weight: 700;
    }

    @keyframes pop {
      0% { transform: scale(1); } 40% { transform: scale(.9); }
      70% { transform: scale(1.1); } 100% { transform: scale(1); }
    }
    @keyframes grow {
      from { opacity: 0; transform: translateY(-16px) scale(.92); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fly {
      from { opacity: 1; transform: translate(0,0) scale(1); }
      to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .node, .photo, .tree li > ul, .node.pop, .spark { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <h1>हमारा परिवार</h1>
  <p class="hint">Kisi ke dabbe par dabao to bachche khulenge ya chhupenge. Photo par dabao to bada dikhega.</p>
  <div class="wrap"><div class="tree" id="tree"></div></div>
  <div id="overlay"><img id="bigphoto" alt=""><p id="cap"></p></div>

  <script>
    // ============================================================
    //  APNA PARIVAR YAHAN LIKHO (purana wala data yahan paste karo)
    //  Jiski shaadi nahi hui: spouse: null
    //  Jiske bacche nahi: children: []
    // ============================================================
var family = {

      children: [

        // ---------- Son 1 ----------
        { name: "Dinesh", dob: "xx-xx-xxxx", photo: "dinesh.jpg",
          spouse: { name: "Aasha", dob: "xx-xx-xxxx", photo: "Aasha.jpg" },
          children: [
            { name: "Mona", dob: "xx-xx-xxxx", photo: "Mona.jpg",
              spouse: { name: "Yogi", dob: "xx-xx-xxxx", photo: "Yogi.jpg" },
              children: [
                { name: "Aadhya", dob: "xx-xx-xxxx", photo: "Aadhya.jpg", spouse: null, children: [] },
              ]
            },          
            { name: "Leesha", dob: "xx-xx-xxxx", photo: "Leesha.jpg",

              children: [
                { name: "Atharv", dob: "xx-xx-xxxx", photo: "Atharv.jpg", spouse: null, children: [] },
                { name: "Pihu", dob: "xx-xx-xxxx", photo: "Pihu.jpg", spouse: null, children: [] }
              ]
            }
          ]
        },

        // ---------- Son 2 ----------
        { name: "Umesh", dob: "xx-xx-xxxx", photo: "umesh.jpg",
          spouse: { name: "Nirmala", dob: "xx-xx-xxxx", photo: "nirmala.jpg" },
          children: [
            { name: "Rohit", dob: "xx-xx-xxxx", photo: "rohit.jpg", spouse: null, children: [] },
            { name: "Shubhangi", dob: "xx-xx-xxxx", photo: "shubhangi.jpg",
              spouse: { name: "Anil", dob: "xx-xx-xxxx", photo: "anil.jpg" },
              children: [ 
                { name: "Anshi", dob: "xx-xx-xxxx", photo: "anshi.jpg", spouse: null, children: [] }
              ]
            },
          ]
        },
        // ---------- Son 3 ----------

        { name: "Mahendra", dob: "31.07.1965", photo: "mahendra.jpg",
          spouse: { name: "Kanta", dob: "15.07.1966", photo: "kanta.jpg" },
          children: [
            { name: "Garima", dob: "04.04.1993", photo: "garima.jpg",
              spouse: { name: "Dheeraj", dob: "01.08.1993", photo: "dheeraj.jpg" },
              children: []
            },
            { name: "Anjali", dob: "18.07.1994", photo: "anjali.jpg",
              spouse: { name: "Deepak", dob: "18.10.1991", photo: "deepak.jpg" },
              children: []
            },
            { name: "Anurag", dob: "10.01.2004", photo: "anurag.jpg", spouse: null, children: [] },
            { name: "Prateek", dob: "15.06.2005", photo: "prateek.jpg", spouse: null, children: [] }
          ]
        },
        // ---------- Son 4 ----------
        { name: "Kailash", dob: "xx-xx-xxxx", photo: "kailash.jpg",
          spouse: { name: "Kusum", dob: "xx-xx-xxxx", photo: "kusum.jpg" },
          children: [
            { name: "Sparsh", dob: "xx-xx-xxxx", photo: "sparsh.jpg", spouse: null, children: [] },
            { name: "Vanshika", dob: "xx-xx-xxxx", photo: "vanshika.jpg", spouse: null, children: [] }
          ]
        },
        // ---------- Son 5 ----------
        { name: "Keshav", dob: "xx-xx-xxxx", photo: "Keshav.jpg",
          spouse: { name: "Babita", dob: "xx-xx-xxxx", photo: "Babita.jpg" },
          children: [
            { name: "Abhishek", dob: "xx-xx-xxxx", photo: "abhishek.jpg", spouse: null, children: [] },
            { name: "Kinjal", dob: "xx-xx-xxxx", photo: "kinjal.jpg", spouse: null, children: [] },
              ]
            }
      ]
    };

    // ============================================================
    //  Yahan se neeche kuch badalne ki zaroorat nahi
    // ============================================================
    function openPhoto(p) {
      document.getElementById("bigphoto").src = p.photo;
      document.getElementById("cap").textContent = p.name + (p.dob ? "  |  " + p.dob : "");
      document.getElementById("overlay").style.display = "flex";
    }
    document.getElementById("overlay").onclick = function () { this.style.display = "none"; };
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") document.getElementById("overlay").style.display = "none";
    });

    function personBox(p) {
      var d = document.createElement("div");
      d.className = "person";

      var img;
      if (p.photo) {
        img = document.createElement("img");
        img.src = p.photo; img.alt = p.name; img.className = "photo zoom";
        img.onclick = function (e) { e.stopPropagation(); openPhoto(p); };
      } else {
        img = document.createElement("div");
        img.className = "photo";
      }
      d.appendChild(img);

      var b = document.createElement("b"); b.textContent = p.name;
      d.appendChild(b);
      if (p.dob) {
        var s = document.createElement("small"); s.textContent = p.dob;
        d.appendChild(s);
      }
      return d;
    }

var COLORS = ["#e9b949", "#4fd1b0", "#ff7a9c", "#9b8cff", "#6cb6ff"];
function sparkle(x, y, color) {
  for (var i = 0; i < 10; i++) {
    var s = document.createElement("span");
    s.className = "spark";
    s.style.left = x + "px";
    s.style.top = y + "px";
    s.style.setProperty("--sc", color);
    var a = (Math.PI * 2 * i) / 10;
    var r = 40 + (i % 3) * 18;
    s.style.setProperty("--dx", Math.cos(a) * r + "px");
    s.style.setProperty("--dy", Math.sin(a) * r + "px");
    document.body.appendChild(s);
    setTimeout((function (el) { return function () { el.remove(); }; })(s), 700);
  }
}
function build(p, level) {
  var li = document.createElement("li");
  var node = document.createElement("div");
  node.className = "node";
  node.style.setProperty("--c", COLORS[level % COLORS.length]);
  node.appendChild(personBox(p));
  if (p.spouse) node.appendChild(personBox(p.spouse));
  li.appendChild(node);

  var hasKids = p.children && p.children.length;

  if (hasKids) {
    var c = document.createElement("span");
    c.className = "count";
    c.textContent = "Bachche: " + p.children.length;
    li.appendChild(c);

    var ul = document.createElement("ul");
    p.children.forEach(function (ch) { ul.appendChild(build(ch, level + 1)); });
    li.appendChild(ul);
  }

  node.onclick = function (e) {
    node.classList.remove("pop");
    void node.offsetWidth;
    node.classList.add("pop");
    sparkle(e.clientX, e.clientY, COLORS[level % COLORS.length]);
    if (hasKids) li.classList.toggle("closed");
  };
  return li;
}

var root = document.createElement("ul");
root.appendChild(build(family, 0));
document.getElementById("tree").appendChild(root);
  </script>
</body>
</html>
