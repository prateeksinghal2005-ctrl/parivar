  <style>
      /* ---------- hover aur click ke effects ---------- */
.node {
  border-bottom-color: var(--c, #1f5a3c);
  transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
}
.node:hover {
  transform: translateY(-8px) scale(1.07);
  background: linear-gradient(135deg, #fffaf0, #eaf8ef);
  box-shadow: 0 16px 26px -6px var(--c, #1f5a3c), 0 0 0 3px var(--c, #1f5a3c);
}
.node:active { transform: scale(.93); }
.node.pop { animation: pop .4s ease; }

.photo { transition: transform .3s ease; border-color: var(--c, #1f5a3c); }
.node:hover .photo { transform: scale(1.12) rotate(-4deg); }

.tree li > ul { animation: grow .4s ease; transform-origin: top center; }

.spark { position: fixed; pointer-events: none; z-index: 20; font-size: 18px;
         animation: fly .7s ease-out forwards; }

@keyframes pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(.88); }
  70%  { transform: scale(1.12); }
  100% { transform: scale(1); }
}
@keyframes grow {
  from { opacity: 0; transform: translateY(-16px) scale(.9); }
  to   { opacity: 1; transform: none; }
}
@keyframes fly {
  from { opacity: 1; transform: translate(0, 0) scale(1); }
  to   { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4); }
}

@media (prefers-reduced-motion: reduce) {
  .node, .photo, .tree li > ul, .node.pop, .spark { animation: none; transition: none; }
}
    body { font-family: Georgia, serif; background: #eef2ec; color: #1c2b22; margin: 0; padding: 20px; }
    h1 { text-align: center; margin: 0 0 4px; }
    .hint { text-align: center; color: #5d6b62; font-size: 14px; margin: 0 0 20px; }
    .wrap { overflow-x: auto; padding-bottom: 20px; }

    /* ---------- tree ki lines ---------- */
    .tree { width: max-content; margin: 0 auto; }
    .tree ul { display: flex; justify-content: center; padding: 20px 0 0; margin: 0; position: relative; }
    .tree li { list-style: none; text-align: center; position: relative; padding: 20px 8px 0; }
    .tree li::before, .tree li::after {
      content: ""; position: absolute; top: 0; right: 50%;
      border-top: 2px solid #1f5a3c; width: 50%; height: 20px; }
    .tree li::after { right: auto; left: 50%; border-left: 2px solid #1f5a3c; }
    .tree li:only-child::before, .tree li:only-child::after { display: none; }
    .tree li:only-child { padding-top: 0; }
    .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
    .tree li:last-child::before { border-right: 2px solid #1f5a3c; border-radius: 0 6px 0 0; }
    .tree li:first-child::after { border-radius: 6px 0 0 0; }
    .tree ul ul::before {
      content: ""; position: absolute; top: 0; left: 50%;
      border-left: 2px solid #1f5a3c; height: 20px; }
    .tree > ul { padding-top: 0; }
    .tree > ul > li { padding-top: 0; }
    .tree li.closed > ul { display: none; }

    /* ---------- person ka dabba ---------- */
    .node { display: inline-flex; gap: 10px; align-items: flex-start; background: #fff;
            border: 1px solid #cdd8cf; border-bottom: 4px solid #1f5a3c; border-radius: 8px;
            padding: 10px; cursor: pointer; }
    .node:hover { background: #f4faf5; }
    .person { width: 96px; }
    .person b { display: block; font-size: 15px; margin-top: 5px; }
    .person small { display: block; color: #5d6b62; font-size: 12px; }
    .photo { width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
             display: block; margin: 0 auto; border: 2px solid #1f5a3c; background: #cdd8cf; }
    .zoom { cursor: zoom-in; }
    .count { display: block; font-size: 11px; color: #1f5a3c; margin-top: 3px; }

    /* ---------- photo bada karne wala ---------- */
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
               z-index: 10; flex-direction: column; align-items: center;
               justify-content: center; padding: 20px; cursor: zoom-out; }
    #overlay img { max-width: 100%; max-height: 80vh; border-radius: 8px; }
    #overlay p { color: #fff; font-size: 20px; margin: 12px 0 0; text-align: center; }
  </style>
</head>

    // ============================================================
    //  Yahan se neeche kuch badalne ki zaroorat nahi
    // ============================================================
    function openPhoto(p) {
      document.getElementById("bigphoto").src = p.photo;
      document.getElementById("cap").textContent = p.name + (p.dob ? "  |  " + p.dob : "");
      document.getElementById("overlay").style.display = "flex";
    }
    document.getElementById("overlay").onclick = function () { this.style.display = "none"; };
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") document.getElementById("overlay").style.display = "none";
    });

    function personBox(p) {
      var d = document.createElement("div");
      d.className = "person";

      var img;
      if (p.photo) {
        img = document.createElement("img");
        img.src = p.photo; img.alt = p.name; img.className = "photo zoom";
        img.onclick = function (e) { e.stopPropagation(); openPhoto(p); };
      } else {
        img = document.createElement("div");
        img.className = "photo";
      }
      d.appendChild(img);

      var b = document.createElement("b"); b.textContent = p.name;
      d.appendChild(b);
      if (p.dob) {
        var s = document.createElement("small"); s.textContent = p.dob;
        d.appendChild(s);
      }
      return d;
    }

   var COLORS = ["#e8a317", "#1f9d5c", "#2d7be5", "#d6428a", "#8a4fd6"];

function sparkle(x, y) {
  var icons = ["✨", "🌟", "💚", "🎉"];
  for (var i = 0; i < 8; i++) {
    var s = document.createElement("span");
    s.textContent = icons[i % 4];
    s.className = "spark";
    s.style.left = x + "px";
    s.style.top = y + "px";
    var a = (Math.PI * 2 * i) / 8;
    s.style.setProperty("--dx", Math.cos(a) * 60 + "px");
    s.style.setProperty("--dy", Math.sin(a) * 60 + "px");
    document.body.appendChild(s);
    setTimeout((function (el) { return function () { el.remove(); }; })(s), 700);
  }
}

function build(p, level) {
  var li = document.createElement("li");
  var node = document.createElement("div");
  node.className = "node";
  node.style.setProperty("--c", COLORS[level % COLORS.length]);
  node.appendChild(personBox(p));
  if (p.spouse) node.appendChild(personBox(p.spouse));
  li.appendChild(node);

  var hasKids = p.children && p.children.length;

  if (hasKids) {
    var c = document.createElement("span");
    c.className = "count";
    c.textContent = "Bachche: " + p.children.length;
    li.appendChild(c);

    var ul = document.createElement("ul");
    p.children.forEach(function (ch) { ul.appendChild(build(ch, level + 1)); });
    li.appendChild(ul);
  }

  node.onclick = function (e) {
    node.classList.remove("pop");
    void node.offsetWidth;
    node.classList.add("pop");
    sparkle(e.clientX, e.clientY);
    if (hasKids) li.classList.toggle("closed");
  };
  return li;
}

var root = document.createElement("ul");
root.appendChild(build(family, 0));
document.getElementById("tree").appendChild(root);
