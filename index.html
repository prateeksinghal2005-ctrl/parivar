<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500&family=Tiro+Devanagari+Hindi&display=swap">
  <style>
    :root {
      --bg: #0f1220;
      --ink: #f3ecdf;
      --muted: #a8a2b8;
      --gold: #d9b26f;
      --line: rgba(217, 178, 111, .55);
    }
    body {
      margin: 0; padding: 40px 20px 60px; min-height: 100vh; color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(900px 500px at 50% -10%, #2c2254 0%, transparent 60%),
        radial-gradient(700px 500px at 100% 100%, rgba(80, 30, 70, .45) 0%, transparent 60%),
        var(--bg);
      background-size: 100% 100%, 100% 100%, auto;
      animation: aurora 12s ease-in-out infinite alternate;
    }

    /* ---------- chamakte taare (background) ---------- */
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .stars::before, .stars::after {
      content: ""; position: absolute; inset: 0;
      background-repeat: repeat;
    }
    .stars::before {
      background-image:
        radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 120px 80px, #f3d9a4, transparent),
        radial-gradient(1.5px 1.5px at 200px 150px, #fff, transparent);
      background-size: 240px 200px;
      animation: twinkle 4s ease-in-out infinite;
    }
    .stars::after {
      background-image:
        radial-gradient(1px 1px at 70px 120px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 170px 40px, #d9b26f, transparent),
        radial-gradient(1px 1px at 40px 180px, #fff, transparent);
      background-size: 290px 230px;
      animation: twinkle 6s ease-in-out 1.5s infinite;
    }

    h1 {
      position: relative; z-index: 1;
      text-align: center; margin: 0; font-weight: 400;
      font-family: "Tiro Devanagari Hindi", Georgia, serif;
      font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: .02em;
      background: linear-gradient(90deg, #f3ecdf 0%, #f3ecdf 35%, #ffd98a 50%, #f3ecdf 65%, #f3ecdf 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: dropin .9s cubic-bezier(.2,.8,.2,1) backwards, shine 5s linear 1s infinite;
    }
    h1::after {
      content: ""; display: block; width: 72px; height: 2px;
      margin: 14px auto 0; background: var(--gold);
      animation: lineGrow 1s ease .5s backwards;
    }
    .hint {
      position: relative; z-index: 1;
      text-align: center; color: var(--muted); margin: 14px 0 6px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic; font-size: 19px;
    }
    .wrap { position: relative; z-index: 1; display: flex; overflow-x: auto; padding: 30px 10px 50px; }

    /* ---------- tree ki lines ---------- */
    .tree { flex: none; margin: 0 auto; }
    .tree ul { display: flex; justify-content: center; padding: 24px 0 0; margin: 0; position: relative; }
    .tree li { list-style: none; text-align: center; position: relative; padding: 24px 10px 0; }
    .tree li::before, .tree li::after {
      content: ""; position: absolute; top: 0; right: 50%;
      border-top: 1.5px solid var(--line); width: 50%; height: 24px;
      animation: lineIn .8s ease backwards; animation-delay: calc(var(--d, 0s) - .15s);
    }
    .tree li::after { right: auto; left: 50%; border-left: 1.5px solid var(--line); }
    .tree li:only-child::before, .tree li:only-child::after { display: none; }
    .tree li:only-child { padding-top: 0; }
    .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
    .tree li:last-child::before { border-right: 1.5px solid var(--line); border-radius: 0 10px 0 0; }
    .tree li:first-child::after { border-radius: 10px 0 0 0; }
    .tree ul ul::before {
      content: ""; position: absolute; top: 0; left: 50%;
      border-left: 1.5px solid var(--line); height: 24px;
      animation: lineIn .8s ease backwards; animation-delay: calc(var(--d, 0s) - .15s);
    }
    .tree > ul { padding-top: 0; }
    .tree > ul > li { padding-top: 0; }
    .tree li.closed > ul { display: none; }

    /* ---------- person ka dabba ---------- */
    .node {
      position: relative; overflow: hidden; display: inline-flex; gap: 14px;
      align-items: flex-start; padding: 18px 16px 14px; border-radius: 18px; cursor: pointer;
      background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.12);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px -12px rgba(0,0,0,.7);
      transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s;
      animation: rise .8s cubic-bezier(.2,.8,.2,1) backwards;
      animation-delay: var(--d, 0s);
    }
    /* upar ki patti: chamakti hui */
    .node::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
      background: linear-gradient(90deg, var(--c, var(--gold)) 0%, #fff 50%, var(--c, var(--gold)) 100%);
      background-size: 250% 100%;
      animation: bar 3.5s linear infinite;
    }
    /* hover par chamak ki lakeer */
    .node::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent);
      transform: skewX(-20deg); pointer-events: none;
    }
    .node:hover::after { animation: sweep .9s ease; }
    .node:hover {
      transform: perspective(700px) translateY(-8px) scale(1.05) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      border-color: var(--c, var(--gold));
      box-shadow: 0 22px 40px -10px color-mix(in srgb, var(--c, #d9b26f) 70%, transparent),
                  0 0 0 1px var(--c, var(--gold));
    }
    .node:active { transform: scale(.94); }
    .node.pop { animation: pop .4s ease; }
    .node .person + .person { border-left: 1px solid var(--line); padding-left: 14px; }

    .person { width: 100px; }
    .person b {
      display: block; margin-top: 8px; font-weight: 700; font-size: 19px; line-height: 1.15;
      font-family: "Cormorant Garamond", Georgia, serif;
    }
    .person small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; letter-spacing: .04em; }

    .photo {
      width: 68px; height: 68px; border-radius: 50%; object-fit: cover;
      display: block; margin: 0 auto; padding: 2px; background: #2a2540;
      border: 2px solid var(--c, var(--gold));
      box-shadow: 0 0 0 4px rgba(255,255,255,.06);
      transition: transform .3s ease;
      /* 'translate' alag property hai, isliye hover ke transform se nahi takrata */
      animation: float 4s ease-in-out infinite, glow 3s ease-in-out infinite;
      animation-delay: var(--d, 0s);
    }
    .node:hover .photo { transform: scale(1.1) rotate(-4deg); }
    .zoom { cursor: zoom-in; }

    .count {
      display: inline-block; margin-top: 12px; padding: 2px 12px; border-radius: 99px;
      font-size: 11px; letter-spacing: .05em; color: var(--gold);
      border: 1px solid var(--line); background: rgba(217,178,111,.08);
      animation: rise .8s ease backwards; animation-delay: calc(var(--d, 0s) + .3s);
    }
    .tree li.closed > .count {
      background: var(--gold); color: #1a1530;
      animation: beat 1.4s ease-in-out infinite;
    }

    .tree li > ul { animation: grow .45s cubic-bezier(.2,.8,.2,1); transform-origin: top center; }

    /* ---------- click par chamakti bindiyan ---------- */
    .spark {
      position: fixed; pointer-events: none; z-index: 20;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--sc); box-shadow: 0 0 10px var(--sc);
      animation: fly .8s ease-out forwards;
    }
    .ring {
      position: fixed; pointer-events: none; z-index: 19;
      width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
      border: 2px solid var(--sc);
      animation: ripple .7s ease-out forwards;
    }

    /* ---------- photo bada karne wala ---------- */
    #overlay {
      display: none; position: fixed; inset: 0; z-index: 10; padding: 20px; cursor: zoom-out;
      background: rgba(8, 8, 18, .9); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      flex-direction: column; align-items: center; justify-content: center;
      animation: fadein .25s ease;
    }
    #overlay img {
      max-width: 100%; max-height: 78vh; border-radius: 14px;
      border: 2px solid var(--gold); box-shadow: 0 30px 60px -10px rgba(0,0,0,.8);
      animation: zoomin .45s cubic-bezier(.2,.9,.3,1.2);
    }
    #overlay p {
      margin: 16px 0 0; text-align: center; color: var(--gold);
      font-family: "Cormorant Garamond", Georgia, serif; font-size: 26px; font-weight: 700;
      animation: dropup .5s ease .15s backwards;
    }

    /* ---------- NAYE animations ---------- */
    .person { position: relative; }
    .bday {
      position: absolute; top: -8px; right: 6px; font-size: 22px;
      animation: bounce 1s ease-in-out infinite; filter: drop-shadow(0 0 6px #ffd98a);
    }
    .isbday .photo { border-color: #ffd98a; animation: float 4s ease-in-out infinite, glow 1s ease-in-out infinite; }
    .orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .orb {
      position: absolute; bottom: -30px; border-radius: 50%; opacity: 0;
      background: radial-gradient(circle, rgba(255,217,138,.9), rgba(255,217,138,0) 70%);
      animation: orb linear infinite;
    }
    .shoot {
      position: fixed; z-index: 0; width: 110px; height: 2px; pointer-events: none; opacity: 0;
      background: linear-gradient(90deg, #fff, transparent);
      animation: shoot 1.1s ease-out forwards;
    }
    .dust {
      position: fixed; z-index: 20; pointer-events: none; width: 5px; height: 5px; border-radius: 50%;
      animation: dust .8s ease-out forwards;
    }
    .tree li.closing > ul { animation: shrink .3s ease forwards; }
    .count:hover { animation: bounce .6s ease; }
    #overlay img { animation: zoomin .45s cubic-bezier(.2,.9,.3,1.2), sway 6s ease-in-out .5s infinite; }

    .person b { transition: color .3s, letter-spacing .3s; }
    .node:hover .person b { color: var(--c, var(--gold)); letter-spacing: .06em; }
    .stars { inset: -30px; transition: transform .4s ease-out; }
    h1 { cursor: pointer; }
    .confetti {
      position: fixed; top: -14px; z-index: 15; pointer-events: none;
      width: 8px; height: 12px; border-radius: 2px;
      animation: fall linear forwards;
    }

    /* ---------- search / theme / music ---------- */
    .bar { position: relative; z-index: 2; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; animation: dropup .8s ease 1s backwards; }
    .bar input {
      width: 170px; padding: 9px 16px; border-radius: 99px; font: inherit; font-size: 14px; color: var(--ink);
      background: rgba(255,255,255,.08); border: 1px solid var(--line); outline: none;
      transition: width .4s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
    }
    .bar input:focus { width: 250px; box-shadow: 0 0 18px rgba(217,178,111,.5); }
    .bar button {
      width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer;
      background: rgba(255,255,255,.08); border: 1px solid var(--line); color: var(--ink);
      transition: transform .25s, box-shadow .3s;
    }
    .bar button:hover { transform: scale(1.15) rotate(10deg); box-shadow: 0 0 16px rgba(217,178,111,.6); }
    .bar button:active { transform: scale(.88); }
    #musicBtn.on { animation: spin 3s linear infinite; box-shadow: 0 0 18px rgba(217,178,111,.7); }
    #musicBtn.shake { animation: shake .5s ease; }
    .node { transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s, opacity .35s, filter .35s; }
    .node.dim { opacity: .22; filter: grayscale(.7); }
    .node.found {
      border-color: #ffd98a; transform: scale(1.07);
      box-shadow: 0 0 0 2px #ffd98a, 0 0 32px 4px rgba(255,217,138,.6);
    }
    .wrap.flash { animation: fadein .7s ease; }

    body.light {
      --bg: #f6efe2; --ink: #2a2238; --muted: #6d6580; --gold: #b0822f; --line: rgba(176,130,47,.6);
      background:
        radial-gradient(900px 500px at 50% -10%, #f3dcb0 0%, transparent 60%),
        radial-gradient(700px 500px at 100% 100%, rgba(255,160,180,.35) 0%, transparent 60%),
        var(--bg);
    }
    body.light h1 { background-image: linear-gradient(90deg, #2a2238 0%, #2a2238 35%, #b0822f 50%, #2a2238 65%, #2a2238 100%); }
    body.light .node { background: linear-gradient(160deg, rgba(255,255,255,.9), rgba(255,255,255,.55)); border-color: rgba(0,0,0,.1); box-shadow: 0 10px 26px -12px rgba(60,40,20,.35); }
    body.light .stars { opacity: .15; }
    body.light .bar input, body.light .bar button { background: rgba(255,255,255,.7); }
    body.light #overlay { background: rgba(246,239,226,.92); }

    /* ---------- keyframes ---------- */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @keyframes fall {
      to { transform: translate(var(--cx), 105vh) rotate(var(--cr)); opacity: .7; }
    }
    @keyframes orb {
      0% { transform: translate(0, 0); opacity: 0; }
      15% { opacity: .8; }
      100% { transform: translate(var(--sx), -110vh); opacity: 0; }
    }
    @keyframes shoot {
      0% { opacity: 1; transform: translate(0, 0) rotate(35deg); }
      100% { opacity: 0; transform: translate(300px, 210px) rotate(35deg); }
    }
    @keyframes dust {
      from { opacity: .9; transform: scale(1); }
      to { opacity: 0; transform: translateY(24px) scale(.2); }
    }
    @keyframes shrink { to { opacity: 0; transform: translateY(-14px) scale(.9); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes sway { 0%, 100% { rotate: -1.2deg; } 50% { rotate: 1.2deg; } }
    @keyframes pop {
      0% { transform: scale(1); } 40% { transform: scale(.9); }
      70% { transform: scale(1.1); } 100% { transform: scale(1); }
    }
    @keyframes grow {
      from { opacity: 0; transform: translateY(-16px) scale(.92); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fly {
      from { opacity: 1; transform: translate(0,0) scale(1); }
      to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); }
    }
    @keyframes ripple {
      from { opacity: .9; transform: scale(1); }
      to { opacity: 0; transform: scale(6); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(30px) scale(.85); }
      to { opacity: 1; transform: none; }
    }
    @keyframes lineIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes float {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -4px; }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 4px rgba(255,255,255,.06), 0 0 0 rgba(0,0,0,0); }
      50% { box-shadow: 0 0 0 4px rgba(255,255,255,.06), 0 0 18px color-mix(in srgb, var(--c, #d9b26f) 70%, transparent); }
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    @keyframes bar { from { background-position: 0% 0; } to { background-position: 250% 0; } }
    @keyframes sweep { from { left: -60%; } to { left: 130%; } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    @keyframes aurora {
      from { background-position: 0 0, 0 0, 0 0; }
      to { background-position: 0 30px, -40px -20px, 0 0; }
    }
    @keyframes dropin { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: none; } }
    @keyframes dropup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes shine { from { background-position: 100% 0; } to { background-position: -150% 0; } }
    @keyframes lineGrow { from { width: 0; opacity: 0; } to { width: 72px; opacity: 1; } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomin { from { opacity: 0; transform: scale(.6) rotate(-3deg); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      h1 { -webkit-text-fill-color: var(--ink); color: var(--ink); }
    }
  </style>
</head>

      sparkle(window.innerWidth / 2, window.innerHeight / 2, "#d9b26f");
    }
    document.getElementById("overlay").onclick = function () { this.style.display = "none"; };
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") document.getElementById("overlay").style.display = "none";
    });

    function personBox(p) {
      var d = document.createElement("div");
      d.className = "person";

      var img;
      if (p.photo) {
        img = document.createElement("img");
        img.src = p.photo; img.alt = p.name; img.className = "photo zoom";
        img.onclick = function (e) { e.stopPropagation(); openPhoto(p); };
      } else {
        img = document.createElement("div");
        img.className = "photo";
      }
      d.appendChild(img);

      var b = document.createElement("b"); b.textContent = p.name;
      d.appendChild(b);
      var m = /^(\d{2})[.\-](\d{2})/.exec(p.dob || "");
      var now = new Date();
      if (m && +m[1] === now.getDate() && +m[2] === now.getMonth() + 1) {
        var cake = document.createElement("span");
        cake.className = "bday"; cake.textContent = "🎂";
        d.appendChild(cake); d.classList.add("isbday");
      }
      if (p.dob) {
        var s = document.createElement("small"); s.textContent = p.dob;
        d.appendChild(s);
      }
      return d;
    }

var COLORS = ["#e9b949", "#4fd1b0", "#ff7a9c", "#9b8cff", "#6cb6ff"];
function sparkle(x, y, color) {
  var ring = document.createElement("span");
  ring.className = "ring";
  ring.style.left = x + "px";
  ring.style.top = y + "px";
  ring.style.setProperty("--sc", color);
  document.body.appendChild(ring);
  setTimeout(function () { ring.remove(); }, 700);

  for (var i = 0; i < 14; i++) {
    var s = document.createElement("span");
    s.className = "spark";
    s.style.left = x + "px";
    s.style.top = y + "px";
    s.style.setProperty("--sc", color);
    var a = (Math.PI * 2 * i) / 14;
    var r = 40 + (i % 3) * 20;
    s.style.setProperty("--dx", Math.cos(a) * r + "px");
    s.style.setProperty("--dy", Math.sin(a) * r + "px");
    document.body.appendChild(s);
    setTimeout((function (el) { return function () { el.remove(); }; })(s), 800);
  }
}

var counter = 0; // har dabbe ko thoda alag delay dene ke liye
function build(p, level) {
  var li = document.createElement("li");
  // pehle upar wale, phir neeche wale, ek ke baad ek aate hain
  li.style.setProperty("--d", (level * 0.35 + counter * 0.06).toFixed(2) + "s");
  counter++;

  var node = document.createElement("div");
  node.className = "node";
  node.style.setProperty("--c", COLORS[level % COLORS.length]);
  node.appendChild(personBox(p));
  if (p.spouse) node.appendChild(personBox(p.spouse));
  li.appendChild(node);

  node.addEventListener("mousemove", function (e) {
    var r = node.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width - .5;
    var y = (e.clientY - r.top) / r.height - .5;
    node.style.setProperty("--ry", (x * 14) + "deg");
    node.style.setProperty("--rx", (-y * 14) + "deg");
  });
  node.addEventListener("mouseleave", function () {
    node.style.setProperty("--rx", "0deg");
    node.style.setProperty("--ry", "0deg");
  });

  var hasKids = p.children && p.children.length;

  if (hasKids) {
    var c = document.createElement("span");
    c.className = "count";
    c.textContent = "Bachche: " + p.children.length;
    li.appendChild(c);

    var ul = document.createElement("ul");
    p.children.forEach(function (ch) { ul.appendChild(build(ch, level + 1)); });
    li.appendChild(ul);
  }

  node.onclick = function (e) {
    node.classList.remove("pop");
    void node.offsetWidth;
    node.classList.add("pop");
    sparkle(e.clientX, e.clientY, COLORS[level % COLORS.length]);
    if (hasKids) {
      if (li.classList.contains("closed")) {
        li.classList.remove("closed");
      } else {
        li.classList.add("closing");
        setTimeout(function () { li.classList.remove("closing"); li.classList.add("closed"); }, 280);
      }
    }
  };
  return li;
}

var root = document.createElement("ul");
root.appendChild(build(family, 0));
document.getElementById("tree").appendChild(root);

// ---------- upar uthti sunehri roshni ----------
var orbs = document.createElement("div");
orbs.className = "orbs";
for (var i = 0; i < 20; i++) {
  var o = document.createElement("span");
  o.className = "orb";
  var size = 6 + Math.random() * 12;
  o.style.width = o.style.height = size + "px";
  o.style.left = Math.random() * 100 + "%";
  o.style.animationDuration = (9 + Math.random() * 9) + "s";
  o.style.animationDelay = (Math.random() * 10) + "s";
  o.style.setProperty("--sx", (Math.random() * 120 - 60) + "px");
  orbs.appendChild(o);
}
document.body.appendChild(orbs);

// ---------- toota taara ----------
setInterval(function () {
  var s = document.createElement("span");
  s.className = "shoot";
  s.style.left = Math.random() * 60 + "%";
  s.style.top = Math.random() * 30 + "%";
  document.body.appendChild(s);
  setTimeout(function () { s.remove(); }, 1200);
}, 7000);

// ---------- mouse ke peeche chamak ----------
var lastDust = 0;
document.addEventListener("mousemove", function (e) {
  var t = Date.now();
  if (t - lastDust < 60) return;
  lastDust = t;
  var d = document.createElement("span");
  var c = COLORS[Math.floor(Math.random() * COLORS.length)];
  d.className = "dust";
  d.style.left = e.clientX + "px";
  d.style.top = e.clientY + "px";
  d.style.background = c;
  d.style.boxShadow = "0 0 8px " + c;
  document.body.appendChild(d);
  setTimeout(function () { d.remove(); }, 800);
});

// ---------- taare mouse ke saath halke hilte hain (parallax) ----------
var starsEl = document.querySelector(".stars");
document.addEventListener("mousemove", function (e) {
  var x = (e.clientX / window.innerWidth - .5) * -20;
  var y = (e.clientY / window.innerHeight - .5) * -20;
  starsEl.style.transform = "translate(" + x + "px," + y + "px)";
});

// ---------- upar se girta confetti ----------
function confetti(n) {
  var cols = COLORS.concat(["#ffd98a", "#ffffff"]);
  for (var k = 0; k < n; k++) {
    var c = document.createElement("span");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "%";
    c.style.background = cols[Math.floor(Math.random() * cols.length)];
    c.style.setProperty("--cx", (Math.random() * 240 - 120) + "px");
    c.style.setProperty("--cr", (360 + Math.random() * 720) + "deg");
    c.style.animationDuration = (2.5 + Math.random() * 2) + "s";
    c.style.animationDelay = (Math.random() * .5) + "s";
    document.body.appendChild(c);
    setTimeout((function (el) { return function () { el.remove(); }; })(c), 5500);
  }
}
setTimeout(function () { confetti(40); }, 1500);
document.querySelector("h1").onclick = function () { confetti(60); };

// ---------- naam khojo ----------
var searchEl = document.getElementById("search");
searchEl.addEventListener("input", function () {
  var q = searchEl.value.trim().toLowerCase();
  var first = null;
  document.querySelectorAll(".node").forEach(function (n) {
    var hit = false;
    n.querySelectorAll(".person b").forEach(function (b) {
      if (q && b.textContent.toLowerCase().indexOf(q) > -1) hit = true;
    });
    n.classList.toggle("found", hit);
    n.classList.toggle("dim", !!q && !hit);
    if (hit) {
      var li = n.parentElement.parentElement.closest("li");
      while (li) { li.classList.remove("closed"); li = li.parentElement.closest("li"); }
      if (!first) first = n;
    }
  });
  if (first) first.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
});

// ---------- dark / light theme ----------
var themeBtn = document.getElementById("themeBtn");
function setTheme(light) {
  document.body.classList.toggle("light", light);
  themeBtn.textContent = light ? "☀️" : "🌙";
  var w = document.querySelector(".wrap");
  w.classList.remove("flash"); void w.offsetWidth; w.classList.add("flash");
  try { localStorage.setItem("theme", light ? "light" : "dark"); } catch (e) {}
}
themeBtn.onclick = function () { setTheme(!document.body.classList.contains("light")); };
try { if (localStorage.getItem("theme") === "light") setTheme(true); } catch (e) {}

// ---------- music (music.mp3 isi folder me rakho) ----------
var bgm = document.getElementById("bgm");
var musicBtn = document.getElementById("musicBtn");
musicBtn.onclick = function () {
  if (bgm.paused) {
    bgm.play().then(function () { musicBtn.classList.add("on"); }).catch(function () {
      musicBtn.classList.add("shake");
      musicBtn.title = "music.mp3 file nahi mili";
      setTimeout(function () { musicBtn.classList.remove("shake"); }, 600);
    });
  } else {
    bgm.pause(); musicBtn.classList.remove("on");
  }
};
